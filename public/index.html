<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleeper Hit</title>
  <meta name="description" content="Finds upcoming sequels whose audience ranks a quiet artist near the top, checks clearance, and drafts the pitch letter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span>Sleeper Hit</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="roster" aria-selected="false">Roster</button>
      <button role="tab" data-tab="outbox" aria-selected="false">Outbox <span id="outbox-count" class="count"></span></button>
      <button role="tab" data-tab="works" aria-selected="false">Works <span id="works-count" class="count"></span></button>
      <div class="run-control" aria-label="Run controls"><button class="header-run" id="header-run" type="button">Run</button><button class="header-gear" id="header-gear" type="button" aria-label="Schedule settings">⚙</button></div><div class="account-control"><button class="user-icon" id="account" type="button" aria-label="Account" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.25"></circle><path d="M5.5 20c.7-3.3 2.9-5 6.5-5s5.8 1.7 6.5 5"></path></svg></button><div class="account-menu" id="account-menu" hidden><span class="account-label">Signed in as</span><strong id="account-email">you@example.com</strong></div></div>
    </nav>
  </header>

  <main>
    <section id="tab-today" class="tab" aria-live="polite">
      <p class="loading" id="loading">Scoring today's doors with Qloo…</p>
    </section>
    <section id="tab-roster" class="tab" hidden></section>
    <section id="tab-outbox" class="tab" hidden></section>
    <section id="tab-trust" class="tab" hidden></section>
    <section id="tab-works" class="tab" hidden></section>
  </main>

  <footer class="foot">
    <div class="footer-top">
      <div class="footer-brand"><span class="mark" aria-hidden="true"></span><span>Sleeper Hit</span></div>
      <nav class="footer-nav" aria-label="Footer navigation">
        <button class="footer-link" data-tab="trust" type="button">Trust</button>
        <a class="footer-link" href="#privacy">Privacy</a>
        <a class="footer-link" href="#terms">Terms</a>
        <a class="footer-link" href="#help">Help</a>
      </nav>
    </div>
    <p>Qloo describes aggregate audiences, not what a supervisor will pick. Clearance categories set priorities; they are not legal advice. Nothing here sends email.</p>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js" type="module"></script>
  <script src="portfolio-inline.js" type="module"></script>
</body>
</html>
